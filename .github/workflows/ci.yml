name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rollout
          POSTGRES_PASSWORD: rollout
          POSTGRES_DB: rollout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rollout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: rollout
          POSTGRES_PASSWORD: rollout
          POSTGRES_DB: rollout_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build server
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/rollout-server ./cmd/rollout-server
      - name: Build relay
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/rollout-relay ./cmd/rollout-relay
      - name: Build ingest
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/rollout-ingest ./cmd/rollout-ingest
      - name: Build CLI
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/rollout-cli ./cmd/rollout-cli
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  test-dashboard:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-go, build-go, test-dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f deployments/docker/Dockerfile.server -t rollout-server:ci .
      - name: Build relay image
        run: docker build -f deployments/docker/Dockerfile.relay -t rollout-relay:ci .
      - name: Build ingest image
        run: docker build -f deployments/docker/Dockerfile.ingest -t rollout-ingest:ci .
      - name: Build dashboard image
        run: docker build -t rollout-dashboard:ci ./dashboard

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=3 ./internal/flag/ ./internal/targeting/ ./internal/experiment/ | tee benchmark.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmark.txt
